<!DOCTYPE html>

<html lang="cs">

<head>

    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="shortcut icon" href="https://www.mossyart.cz/ico_mossyart.ico" type="image/x-icon">

    <title>Úvodní stránka studia Mossyart</title>



    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">



    <style type="text/css">

        body {

            background-color: #f5f2e5;

            font-family: 'Plus Jakarta Sans', sans-serif;

            line-height: 1.7;

            margin: 0;

            padding: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

        }



        .container {

            max-width: 650px;

            margin: 40px 20px;

            padding: 40px 30px;

            background-color: #ffffff;

            border-radius: 16px;

            box-shadow: 0 10px 30px rgba(166, 137, 76, 0.05);

            text-align: center;

        }



        h1 {

            color: #4a3f35;

            font-size: 2.3rem;

            margin-bottom: 30px;

            font-weight: 700;

            letter-spacing: -0.5px;

        }



        .logo-wrapper {

            display: inline-block;

            margin-bottom: 25px;

            cursor: pointer;

            perspective: 1000px;

        }



        .logo {

            max-width: 170px;

            height: auto;

            border-radius: 50%;

            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;

            box-shadow: 0 4px 10px rgba(0,0,0,0.05);

        }



        .logo-wrapper:hover .logo {

            transform: scale(1.05) rotate(5deg);

            box-shadow: 0 8px 20px rgba(191, 161, 95, 0.15);

        }



        .logo-spin {

            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1);

        }



        @keyframes spin {

            0% { transform: scale(1.05) rotate(0deg); }

            100% { transform: scale(1) rotate(360deg); }

        }



        .uvod-text {

            font-size: 1.05rem;

            color: #6e6154;

            margin-bottom: 22px;

            text-align: justify;

            text-align-last: center;

            font-weight: 400;

        }



        .podpis {

            font-size: 1.3rem;

            font-weight: 600;

            color: #54473c;

            margin: 35px 0;

        }



        .podpis::after {

            content: '';

            display: block;

            width: 40px;

            height: 2px;

            background-color: #bfa15f;

            margin: 15px auto 0 auto;

            border-radius: 2px;

        }



        .vyzva {

            font-size: 1.2rem;

            font-weight: 600;

            color: #4a3f35;

            margin-top: 40px;

            margin-bottom: 25px;

        }



        .odkazy-blok {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 14px;

        }



        .btn {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            width: 100%;

            max-width: 340px;

            padding: 14px 28px;

            font-size: 1.05rem;

            font-weight: 600;

            text-decoration: none;

            border-radius: 30px;

            box-sizing: border-box;

            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.3s ease, box-shadow 0.3s ease;

            box-shadow: 0 4px 10px rgba(0,0,0,0.03);

        }



        .btn i {

            font-size: 1.2rem;

            transition: transform 0.3s ease;

        }



        .btn:hover {

            transform: translateY(-3px);

            box-shadow: 0 8px 20px rgba(0,0,0,0.08);

        }



        .btn:hover i {

            transform: scale(1.2);

        }



        .btn-fler {

            background-color: #dfd6ab;

            color: #4a3f35;

        }



        .btn-fler:hover {

            background-color: #d2c899;

        }



        .btn-instagram {

            background-color: #c4b98a;

            color: #4a3f35;

        }



        .btn-instagram:hover {

            background-color: #b7ab79;

        }



        .btn-mail {

            background-color: #a49a6c;

            color: #ffffff;

        }



        .btn-mail:hover {

            background-color: #938a5d;

        }



        .footer {

            margin-top: 60px;

            opacity: 0.4;

            transition: opacity 0.3s ease;

        }



        .footer:hover {

            opacity: 1;

        }

    </style>

</head>

<body>



<div class="container">



    <h1>Vítejte na stránce studia Mossyart</h1>



    <div class="logo-wrapper" id="logoWrapper">

        <img src="https://www.mossyart.cz/razitko.jpg" alt="Logo Mossyart" class="logo" width="200" height="200">

    </div>



    <p class="podpis">Kateřina Krystova</p>
    <p class="uvod-text">IČO: 07612915</p>
    <p class="uvod-text">Sídlo: Pampelišková 793, 250 91 Zeleneč</p>
    <p class="uvod-text">Zapsána v živnostenském rejstříku vedeném Městským úřadem Brandýs nad Labem-Stará Boleslav.</p>

    <p class="vyzva" id="obchudek-sekce">Navštivte náš tvořivý svět</p>



    <div class="odkazy-blok">

        <a href="https://www.fler.cz/mossyart" class="btn btn-fler" target="_blank">

            <i class="fa-solid fa-bag-shopping"></i> www.fler.cz/mossyart

        </a>



        <a href="https://www.instagram.com/mossyart_hand_made/" class="btn btn-instagram" target="_blank">

            <i class="fa-brands fa-instagram"></i> @mossyart_hand_made

        </a>



        <a href="mailto:mossyart@atlas.cz" class="btn btn-mail">

            <i class="fa-solid fa-envelope"></i> mossyart@atlas.cz

        </a>

    </div>



    <div class="footer">

        <a href="https://www.toplist.cz">

            <script language="JavaScript" type="text/javascript" charset="utf-8">

            </script>

            <noscript>

                <img src="https://toplist.cz/count.asp?id=1804696&logo=bc&njs=1" border="0" alt="TOPlist" width="88" height="120" />

            </noscript>

        </a>

    </div>



</div>



<script>

    const logoWrapper = document.getElementById('logoWrapper');

    const logoImg = logoWrapper.querySelector('.logo');



    logoWrapper.addEventListener('click', () => {

        logoImg.classList.add('logo-spin');



        document.getElementById('obchudek-sekce').scrollIntoView({

            behavior: 'smooth'

        });



        setTimeout(() => {

            logoImg.classList.remove('logo-spin');

        }, 800);

    });

</script>



</body>

</html>
